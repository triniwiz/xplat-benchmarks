buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Same AGP / Kotlin as apps/native-android; the Compose compiler plugin ships with Kotlin.
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0")
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.0")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
