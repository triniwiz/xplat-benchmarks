[workspace]
members = ["."]
resolver = "2"

[package]
name = "xplatbench-whisker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "whisker-config"
path = "whisker.rs"
required-features = ["whisker-config"]
test = false
bench = false

[features]
whisker-config = ["whisker-cng/generate"]

[dependencies]
whisker = "=0.18.0"
whisker-cng = { version = "=0.18.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4"
